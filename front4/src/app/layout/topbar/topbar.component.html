<div class="topbar" [class.admin]="mode === 'admin'" [class.consumidor]="mode === 'consumidor'">

  <!-- Logo fijo -->
  <div class="brand">
    <img src="/SM_Isotipo_blanco_fondo_cyan.png" alt="Smart Clarity" class="brand-logo" />
    <span class="brand-name">Smart Clarity</span>
  </div>

  <!-- Contexto consumidor: selector de empresa + botón subir -->
  @if (mode === 'consumidor') {
    <div class="context-slot">
      <select class="empresa-select" [(ngModel)]="localEmpresaId" (ngModelChange)="onEmpresaChange($event)">
        <option value="">Seleccionar empresa</option>
        <option *ngFor="let e of clientesService.clientes()" [value]="e._id">
          {{ e.razon_social }}
        </option>
      </select>
      <!-- <button class="btn-primary" style="font-size:.82rem;padding:.4rem .85rem;white-space:nowrap" (click)="irADocumentos()">
        + Subir documento
      </button> -->
    </div>
  }

  <!-- Iconos configurables (ng-content) -->
  <div class="icons-slot">
    <ng-content select="[topbar-icons]"></ng-content>
  </div>

  <!-- Acciones de perfil -->
  <div class="actions">
    <span class="mode-chip">{{ modeLabel }}</span>
    <button class="toggle-btn" (click)="modeToggle.emit()">Cambiar modo</button>
  </div>

</div>
