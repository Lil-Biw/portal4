<form (ngSubmit)="submit()" class="form-grid">
  <label class="field">
    <span>Razón social *</span>
    <input [(ngModel)]="form.razon_social" name="razon_social" required />
  </label>
  <label class="field">
    <span>RUT *</span>
    <input [(ngModel)]="form.rut" name="rut" required />
  </label>
  <label class="field">
    <span>Email contacto *</span>
    <input [(ngModel)]="form.email_contacto" name="email_contacto" type="email" required />
  </label>
  <label class="field">
    <span>Teléfono</span>
    <input [(ngModel)]="form.telefono" name="telefono" />
  </label>
  <label class="field">
    <span>Calle</span>
    <input [(ngModel)]="form.direccion!.calle" name="calle" />
  </label>
  <label class="field">
    <span>Ciudad</span>
    <input [(ngModel)]="form.direccion!.ciudad" name="ciudad" />
  </label>
  <label class="field">
    <span>Región</span>
    <input [(ngModel)]="form.direccion!.region" name="region" />
  </label>
  <label class="field">
    <span>País</span>
    <input [(ngModel)]="form.direccion!.pais" name="pais" />
  </label>

  <!-- Logo -->
  <label class="field" style="grid-column:1/-1">
    <span>Logo de empresa</span>
    <div style="display:flex;align-items:center;gap:1rem;margin-top:.4rem">
      <div style="width:64px;height:64px;border:1px solid #e5e7eb;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f9fafb;flex-shrink:0">
        @if (logoPreview) {
          <img [src]="logoPreview" alt="logo" style="width:100%;height:100%;object-fit:contain" />
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18"/><rect x="14" y="9" width="7" height="12"/><path d="M10 3h4v4h-4z"/></svg>
        }
      </div>
      <div>
        <input type="file" accept="image/*" (change)="onLogoSelected($event)" style="font-size:.85rem" />
        <p style="margin:.35rem 0 0;font-size:.75rem;color:#9ca3af">Opcional. JPG, PNG o SVG.</p>
      </div>
    </div>
  </label>

  <div class="form-footer">
    <button type="submit" class="btn-primary">{{ submitLabel }}</button>
  </div>
</form>
