<p *ngIf="clientes.length === 0" class="empty">Sin empresas registradas.</p>

<div class="list">
  <div
    *ngFor="let c of clientes"
    class="card"
    [class.selected]="c._id === seleccionadoId">
    <div class="card-main">
      <strong>{{ c.razon_social }}</strong>
      <span class="rut">{{ c.rut }}</span>
      <span class="email">{{ c.email_contacto }}</span>
    </div>
    <div class="card-actions">
      <button *ngIf="mostrarVerFicha" class="btn-ghost btn-sm" (click)="verFicha.emit(c)">Ver ficha</button>
      <button class="btn-ghost btn-sm" (click)="editado.emit(c)">Editar</button>
      <button class="btn-danger"       (click)="eliminado.emit(c._id)">Eliminar</button>
    </div>
  </div>
</div>
