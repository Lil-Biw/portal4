<!-- Encabezado -->
<div class="page-header">
  <div>
    <h2>Proyectos</h2>
    <p class="page-subtitle">Iniciativas en curso por centro de costo.</p>
  </div>
  <div class="header-actions">
    <button class="btn-ghost btn-buscar" (click)="abrirBuscar()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Buscar</button>
    <button class="btn-primary" (click)="abrirCrear()">+ Crear proyecto</button>
  </div>
</div>

<app-status-banner [status]="service.status()"></app-status-banner>

<!-- Lista principal -->
<app-proyectos-list
  [proyectos]="service.proyectos()"
  [clientes]="clientesService.clientes()"
  [centros]="centrosService.centros()"
  (editado)="abrirEditar($event)"
  (eliminado)="eliminar($event)">
</app-proyectos-list>

<!-- ── Modal ──────────────────────────────────────────── -->
<div class="modal-backdrop" *ngIf="modal() !== null" (click)="cerrar()">
  <div class="modal" (click)="$event.stopPropagation()">

    <!-- Crear -->
    <ng-container *ngIf="modal() === 'crear'">
      <div class="modal-header">
        <h3>Nuevo proyecto</h3>
        <button class="modal-close" (click)="cerrar()">&#x2715;</button>
      </div>
      <app-status-banner [status]="service.status()"></app-status-banner>
      <app-proyecto-form
        submitLabel="Crear proyecto"
        [clientes]="clientesService.clientes()"
        [centros]="centrosService.centros()"
        (submitted)="crear($event)">
      </app-proyecto-form>
    </ng-container>

    <!-- Editar -->
    <ng-container *ngIf="modal() === 'editar'">
      <div class="modal-header">
        <h3>Editar proyecto</h3>
        <button class="modal-close" (click)="cerrar()">&#x2715;</button>
      </div>
      <app-status-banner [status]="service.status()"></app-status-banner>
      <app-proyecto-form
        [initial]="service.seleccionado()"
        [clientes]="clientesService.clientes()"
        [centros]="centrosService.centros()"
        submitLabel="Guardar cambios"
        (submitted)="actualizar($event)">
      </app-proyecto-form>
    </ng-container>

    <!-- Buscar -->
    <ng-container *ngIf="modal() === 'buscar'">
      <div class="modal-header">
        <h3>Buscar proyecto</h3>
        <button class="modal-close" (click)="cerrar()">&#x2715;</button>
      </div>
      <input
        class="search-input"
        type="text"
        placeholder="Nombre, código, empresa o centro de costos..."
        [ngModel]="busqueda()"
        (ngModelChange)="busqueda.set($event)"
        autofocus />
      <app-proyectos-list
        [proyectos]="proyectosFiltrados()"
        [clientes]="clientesService.clientes()"
        [centros]="centrosService.centros()"
        (editado)="editarDesdeBuscar($event)"
        (eliminado)="eliminar($event)">
      </app-proyectos-list>
    </ng-container>

  </div>
</div>
