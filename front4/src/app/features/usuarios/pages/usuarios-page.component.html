<!-- Encabezado -->
<div class="page-header">
  <div class="header-title">
    <h2>Usuarios</h2>
    <p class="header-subtitle">Cuentas con acceso al portal.</p>
  </div>
  <div class="header-actions">
    @if (esSuperAdmin()) {
      <button class="btn-ghost" (click)="abrirCrearAdmin()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/><line x1="19" y1="8" x2="23" y2="8"/><line x1="21" y1="6" x2="21" y2="10"/></svg>
        Crear admin
      </button>
    }
    <button class="btn-primary" (click)="abrirCrearUsuario()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="23" y2="8"/><line x1="21" y1="6" x2="21" y2="10"/></svg>
      Crear usuario
    </button>
  </div>
</div>

<app-status-banner [status]="service.status()"></app-status-banner>

<!-- Lista principal agrupada por empresa -->
@for (grupo of usuariosAgrupados(); track grupo.empresa) {
  <div class="empresa-grupo">
    <p class="empresa-titulo">{{ grupo.empresa }}</p>
    <app-usuarios-list
      [usuarios]="grupo.usuarios"
      (editado)="abrirEditar($event)"
      (eliminado)="eliminar($event)"
    >
    </app-usuarios-list>
  </div>
}
@if (usuariosVisibles().length === 0) {
  <p class="empty">Sin usuarios registrados.</p>
}

<!-- ── Modal ──────────────────────────────────────────── -->
<div class="modal-backdrop" *ngIf="modal() !== null" (click)="cerrar()">
  <div class="modal" (click)="$event.stopPropagation()">
    <!-- Crear Administrador -->
    <ng-container *ngIf="modal() === 'crear-admin'">
      <div class="modal-header">
        <h3>Nuevo administrador</h3>
        <button class="modal-close" (click)="cerrar()">&#x2715;</button>
      </div>
      <app-status-banner [status]="service.status()"></app-status-banner>
      <form (ngSubmit)="crearAdmin()" class="form-grid">
        <label class="field">
          <span>Nombre *</span>
          <input [(ngModel)]="adminForm.nombre" name="nombre" required />
        </label>
        <label class="field">
          <span>Email *</span>
          <input [(ngModel)]="adminForm.email" name="email" type="email" required />
        </label>
        <div class="form-footer">
          <button type="submit" class="btn-primary">Crear administrador</button>
        </div>
      </form>
    </ng-container>

    <!-- Crear Usuario -->
    <ng-container *ngIf="modal() === 'crear-usuario'">
      <div class="modal-header">
        <h3>Nuevo usuario</h3>
        <button class="modal-close" (click)="cerrar()">&#x2715;</button>
      </div>
      <app-status-banner [status]="service.status()"></app-status-banner>
      <app-usuario-form
        submitLabel="Crear usuario"
        [clientes]="clientesVisibles()"
        [centros]="centrosVisibles()"
        [centrosSeleccionados]="service.centrosSeleccionados()"
        [esAdminCliente]="esAdminSmartclarity()"
        (centroToggle)="service.toggleCentro($event.centroId, $event.checked)"
        (submitted)="crear($event)"
      >
      </app-usuario-form>
    </ng-container>

    <!-- Editar -->
    <ng-container *ngIf="modal() === 'editar'">
      <div class="modal-header">
        <h3>Editar usuario</h3>
        <button class="modal-close" (click)="cerrar()">&#x2715;</button>
      </div>
      <app-status-banner [status]="service.status()"></app-status-banner>
      <app-usuario-form
        [initial]="service.seleccionado()"
        [clientes]="clientesVisibles()"
        [centros]="centrosVisibles()"
        [centrosSeleccionados]="service.centrosSeleccionados()"
        [isEdit]="true"
        [esAdminCliente]="esAdminSmartclarity()"
        submitLabel="Guardar cambios"
        (centroToggle)="service.toggleCentro($event.centroId, $event.checked)"
        (submitted)="actualizar($event)"
      >
      </app-usuario-form>
    </ng-container>

    <!-- Buscar -->
    <ng-container *ngIf="modal() === 'buscar'">
      <div class="modal-header">
        <h3>Buscar usuario</h3>
        <button class="modal-close" (click)="cerrar()">&#x2715;</button>
      </div>
      <input
        class="search-input"
        type="text"
        placeholder="Nombre o email..."
        [ngModel]="busqueda()"
        (ngModelChange)="busqueda.set($event)"
        autofocus
      />
      <app-usuarios-list
        [usuarios]="usuariosFiltrados()"
        (editado)="editarDesdeBuscar($event)"
        (eliminado)="eliminar($event)"
      >
      </app-usuarios-list>
    </ng-container>
  </div>
</div>
