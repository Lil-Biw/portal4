@if (usuarios.length === 0) {
  <p class="empty">Sin usuarios registrados.</p>
}

@if (usuarios.length > 0) {
  <div class="user-list">
    @for (u of usuarios; track u._id) {
      <div class="user-row">
        <div class="avatar avatar-{{ rolClass(u.rol) }}">{{ initials(u.nombre) }}</div>
        <div class="user-info">
          <span class="user-name">{{ u.nombre }}</span>
          <span class="user-email">{{ u.email }}</span>
        </div>
        <span class="role-badge badge-{{ rolClass(u.rol) }}">{{ rolLabel(u.rol) }}</span>
        <div class="user-actions">
          @if (esAdmin(u)) {
            <button
              class="btn-icon"
              [title]="esPropio(u) ? 'Suscripciones de notificaciones' : 'Solo el propio usuario puede editar sus suscripciones'"
              [disabled]="!esPropio(u)"
              [style.opacity]="esPropio(u) ? 1 : 0.35"
              [style.cursor]="esPropio(u) ? 'pointer' : 'not-allowed'"
              (click)="suscripciones.emit(u)"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
            </button>
          }
          <button class="btn-accion" (click)="editado.emit(u)">{{ accionLabel(u) }}</button>
          <button class="btn-icon" title="Editar" (click)="editado.emit(u)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="btn-icon danger" title="Eliminar" (click)="eliminado.emit(u._id)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </button>
        </div>
      </div>
    }
  </div>
}
