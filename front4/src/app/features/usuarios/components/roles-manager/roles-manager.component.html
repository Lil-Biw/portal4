@if (vista() === 'lista') {
  <div class="rm-lista">
    @for (rol of roles; track rol._id) {
      <div class="rm-row">
        <div class="rm-row-info">
          <div class="rm-row-nombre">{{ rol.nombre }}</div>
          <div class="rm-row-contador">{{ contadorDe(rol).activos }}/{{ contadorDe(rol).total }} permisos activos</div>
        </div>
        <div class="rm-row-acciones">
          <button type="button" class="btn-edit" (click)="abrirEditar(rol)"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><span>Editar</span></button>
          <button type="button" class="btn-delete" (click)="eliminar.emit(rol._id)"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg><span>Eliminar</span></button>
        </div>
      </div>
    }
    @if (roles.length === 0) {
      <p class="rm-empty">Sin roles creados todavía.</p>
    }
  </div>
  <button type="button" class="btn-primary rm-nuevo" (click)="abrirNuevo()">Nuevo rol</button>
}

@if (vista() === 'editar') {
  <div class="rm-nombre-field">
    <label for="rm-nombre">Nombre del rol</label>
    <input id="rm-nombre" type="text" [(ngModel)]="nombreForm" name="nombreForm" placeholder="Ej: Usuario auditor" />
  </div>

  <app-permisos-panel
    [valores]="valoresForm"
    [contextoCompleto]="true"
    (valoresChange)="onValoresChange($event)"
  ></app-permisos-panel>

  <div class="rm-footer">
    <button type="button" class="btn-ghost" (click)="volver()">Cancelar</button>
    <button type="button" class="btn-primary" [disabled]="!nombreForm.trim()" (click)="guardar()">Guardar rol</button>
  </div>
}
