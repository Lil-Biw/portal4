<form (ngSubmit)="submit()" class="form-grid">
  <label class="field">
    <span>Empresa *</span>
    <select
      [(ngModel)]="form.cliente_id"
      name="cliente_id"
      required
      (ngModelChange)="onClienteChange($event)"
      [disabled]="isEdit"
    >
      <option value="">Selecciona empresa</option>
      <option *ngFor="let c of clientes" [value]="c._id">{{ c.razon_social }}</option>
    </select>
  </label>
  <label class="field">
    <span>Nombre *</span>
    <input [(ngModel)]="form.nombre" name="nombre" required />
  </label>
  <label class="field">
    <span>Email *</span>
    <input [(ngModel)]="form.email" name="email" type="email" required />
  </label>
  <label class="field" *ngIf="isEdit">
    <span>Rol</span>
    <select [(ngModel)]="rolUI" name="rol" (ngModelChange)="onRolChange($event)">
      <option *ngFor="let r of rolOpciones" [value]="r.value">{{ r.label }}</option>
    </select>
    <small *ngIf="form.permisos && isEdit" style="display:block; margin-top:.25rem; font-size:.74rem; color:var(--fg-5)">
      Al cambiar el rol se aplican los permisos por defecto de ese rol. "Personalizado" conserva los permisos actuales.
    </small>
  </label>

  <!-- Centros de costos asignados -->
  <div style="grid-column: 1/-1" *ngIf="centrosFiltrados.length > 0">
    <p style="font-size: 0.82rem; font-weight: 600; color: var(--fg-2); margin: 0 0 0.6rem">
      Centros de costos asignados
    </p>
    <div
      style="
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 0.5rem;
      "
    >
      <label
        *ngFor="let c of centrosFiltrados"
        style="
          display: flex;
          align-items: center;
          gap: 0.5rem;
          padding: 0.6rem 0.75rem;
          border: 1px solid var(--border-default);
          border-radius: 8px;
          background: var(--bg-0);
          cursor: pointer;
          font-size: 0.875rem;
        "
      >
        <input
          type="checkbox"
          [checked]="centrosSeleccionados.includes(c._id)"
          (change)="centroToggle.emit({ centroId: c._id, checked: $any($event.target).checked })"
        />
        {{ c.nombre }} <small style="color: var(--fg-5)">({{ c.codigo }})</small>
      </label>
    </div>
  </div>
  <p
    *ngIf="form.cliente_id && centrosFiltrados.length === 0"
    style="grid-column: 1/-1; font-size: 0.85rem; color: var(--fg-5); margin: 0"
  >
    La empresa no tiene centros de costos asociados.
  </p>

  <div class="form-footer">
    <button type="submit" class="btn-primary">{{ submitLabel }}</button>
  </div>
</form>
