<form (ngSubmit)="submit()" class="form-grid">
  <label class="field" style="grid-column:1/-1">
    <span>Empresa *</span>
    <select [(ngModel)]="form.cliente_id" name="cliente_id" required>
      <option value="">Selecciona una empresa</option>
      <option *ngFor="let c of clientes" [value]="c._id">{{ c.razon_social }}</option>
    </select>
  </label>
  <label class="field">
    <span>Código *</span>
    <input [(ngModel)]="form.codigo" name="codigo" required />
  </label>
  <label class="field">
    <span>Nombre *</span>
    <input [(ngModel)]="form.nombre" name="nombre" required />
  </label>
  <label class="field" style="grid-column:1/-1">
    <span>Descripción</span>
    <input [(ngModel)]="form.descripcion" name="descripcion" />
  </label>
  <label class="field">
    <span>Dirección</span>
    <input [(ngModel)]="form.ubicacion_direccion" name="direccion" />
  </label>
  <label class="field">
    <span>Ciudad</span>
    <input [(ngModel)]="form.ubicacion_ciudad" name="ciudad" />
  </label>
  <label class="field">
    <span>Región</span>
    <input [(ngModel)]="form.ubicacion_region" name="region" />
  </label>
  <label class="field">
    <span>País</span>
    <input [(ngModel)]="form.ubicacion_pais" name="pais" />
  </label>
  <div class="field" style="grid-column:1/-1">
    <span>Coordenadas GPS</span>
    <input [(ngModel)]="dmsInput" name="dms"
           (ngModelChange)="onDmsChange()"
           placeholder='ej. 38°45&apos;32.8"S 72°36&apos;34.3"W' />
    @if (dmsError) {
      <small style="color:var(--color-danger,#dc3545)">{{ dmsError }}</small>
    }
    @if (puedePrevisualizar && !dmsError) {
      <small style="color:#6c757d">
        Decimal: {{ form.ubicacion_latitud | number:'1.6-6' }}, {{ form.ubicacion_longitud | number:'1.6-6' }}
      </small>
    }
  </div>
  @if (puedePrevisualizar && !dmsError) {
    <div style="grid-column:1/-1">
      <button type="button" class="btn-ghost btn-sm" (click)="verEnMapa()">
        Ver en mapa
      </button>
    </div>
  }
  @if (previewMapUrl) {
    <div style="grid-column:1/-1">
      <iframe [src]="previewMapUrl"
              width="100%" height="240"
              style="border:0;border-radius:8px;display:block;margin-top:8px"
              allowfullscreen loading="lazy">
      </iframe>
    </div>
  }
  <div class="form-footer">
    <button type="submit" class="btn-primary">{{ submitLabel }}</button>
  </div>
</form>
