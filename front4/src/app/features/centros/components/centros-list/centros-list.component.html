<p *ngIf="grupos().length === 0" class="empty">Sin centros de costos registrados.</p>

<div class="grupos">
  <div *ngFor="let g of grupos()" class="grupo-empresa">

    <!-- Cabecera empresa -->
    <div class="grupo-header">
      <span class="grupo-label">{{ g.empresa.razon_social }}</span>
      <span class="grupo-count">{{ g.centros.length }} centro{{ g.centros.length !== 1 ? 's' : '' }}</span>
    </div>

    <!-- Centros de esa empresa -->
    <div class="grupo-body list">
      <div
        *ngFor="let c of g.centros"
        class="card"
        [class.selected]="c._id === seleccionadoId">
        <div class="card-main">
          <strong>{{ c.nombre }}</strong>
          <span class="rut">Cód. {{ c.codigo }}</span>
          <span class="email" *ngIf="c.ubicacion_ciudad">
            {{ c.ubicacion_ciudad }}{{ c.ubicacion_region ? ', ' + c.ubicacion_region : '' }}
          </span>
        </div>
        <div class="card-actions">
          <button class="btn-ghost btn-sm" (click)="verCentro.emit(c)">Ver centro</button>
          <button class="btn-ghost btn-sm" (click)="editado.emit(c)">Editar</button>
          <button class="btn-danger"       (click)="eliminado.emit(c._id)">Eliminar</button>
        </div>
      </div>
    </div>

  </div>
</div>
